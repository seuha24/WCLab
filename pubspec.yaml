name: safelight
description: A new Flutter project.
publish_to: 'none'
# ios
version: 1.3.1+11

# android
# version: 1.1.1+4
environment:
  sdk: ^3.4.1

dependencies:
  flutter:
    sdk: flutter
  location_plugin:
    path: location_plugin
  cupertino_icons: ^1.0.2

  # themes
  flutter_native_splash: ^2.2.10+1

  # local storages
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # utils
  auto_size_text: ^3.0.0
  flutter_screenutil: ^5.5.4
  shimmer: ^3.0.0
  lottie: ^2.2.0
  fluttertoast: ^8.2.8

  # firebase & authentication
  cloud_firestore: ^5.5.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  sign_in_with_apple: ^6.1.3
  google_sign_in: ^6.2.2

  # state manager
  flutter_bloc: ^8.1.1
  get_it: ^7.2.0
  bloc: ^8.1.0
  rxdart: ^0.27.7
  equatable: ^2.0.5
  dartz: ^0.10.1

  # http
  dio: ^5.7.0
  http: ^1.2.0

  # permissions & device controll
  permission_handler: ^11.1.0
  flutter_local_notifications: ^18.0.1
  sensors_plus: ^4.0.2
  camera: ^0.10.5+9
  flutter_reactive_ble: ^5.0.3
  torch_light: ^1.0.0
  vibration: ^1.8.4
  flutter_tts: ^3.6.3
  speech_to_text: ^6.5.1

  # map & path
  flutter_naver_map: ^1.3.0+1
  geolocator: ^10.1.0
  flutter_compass: ^0.8.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.0
  build_runner: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/
    - lib/assets/images/ic/
    - lib/assets/jsons/lotties/

flutter_native_splash:
  color: "#758BFD"
  image: lib/assets/images/ic/ic_logo.png
  branding: lib/assets/images/ic/ic_copyright.png
  branding_mode: bottom
  #color_dark: "#042a49"
  #background_image_dark: "assets/dark-background.png"
  #image_dark: assets/splash-invert.png
  #branding_dark: assets/dart_dark.png
  android_12:
    color: "#758BFD"
    image: lib/assets/images/ic/ic_logo_android.png
    #color: "#42a5f5"
    #icon_background_color: "#111111"
    #branding: assets/dart.png
    #image_dark: assets/android12splash-invert.png
    #color_dark: "#042a49"
    #icon_background_color_dark: "#eeeeee"
  web: false
  #fullscreen: true