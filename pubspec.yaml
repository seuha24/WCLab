name: safelight
description: A new Flutter project.
publish_to: 'none'
# ios
version: 2.0.1+21

# android
# version: 1.1.1+4
# flutter sdk 3.22.3
environment:
  sdk: ^3.2.6

dependencies:
  flutter:
    sdk: flutter
  location_plugin:
    path: location_plugin
  cupertino_icons: ^1.0.2

  # themes
  flutter_native_splash: ^2.2.10+1

  # local storages
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences:

  # utils
  auto_size_text: ^3.0.0
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  lottie: ^2.2.0
  fluttertoast: ^8.2.8

  # firebase & authentication
  cloud_firestore: ^5.5.1
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.2.2


  # state manager
  flutter_bloc: ^8.1.1
  get_it: ^7.2.0
  bloc: ^8.1.0
  rxdart: ^0.27.7
  equatable: ^2.0.5
  dartz: ^0.10.1

  # http
  dio: ^5.7.0
  http: ^1.2.0

  # permissions & device controll
  permission_handler: ^11.1.0
  flutter_local_notifications: ^18.0.1
  sensors_plus: ^4.0.2
  camera: ^0.10.5+9
  change_app_package_name: ^1.4.0
  flutter_reactive_ble: ^5.0.3
  torch_light: ^1.0.0
  vibration: ^1.8.4
  flutter_tts: ^3.6.3
  speech_to_text: ^7.0.0
  text_to_speech:
    path: text_to_speech-0.2.3


  # map & path
  flutter_naver_map: ^1.3.0+1
  geolocator: ^13.0.2
  flutter_compass: ^0.8.0
  latlong2: ^0.9.0
  simple_kalman: ^1.0.2
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.0
  build_runner: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/
    - lib/assets/images/ic/
    - lib/assets/jsons/lotties/

flutter_native_splash:
  color: "#758BFD"
  image: lib/assets/images/ic/ic_logo.png
  branding: lib/assets/images/ic/ic_copyright.png
  branding_mode: bottom
  android_12:
    color: "#758BFD"
    image: lib/assets/images/ic/ic_logo_android.png
  web: false
  #fullscreen: true